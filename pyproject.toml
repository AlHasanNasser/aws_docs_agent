[project]
name = "aws-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hamza Nasser", email = "hasan.nasser012@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.0",
    "fastapi>=0.141.1",
    "google-genai>=1.38.0",
    "langchain>=1.4.0",
    "langgraph>=1.0.0",
    "langchain-text-splitters>=1.1.2",
    "langsmith>=0.12.5",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "slowapi>=0.1.10",
    "uvicorn>=0.53.0",
    "langchain-classic>=1.0.8",
    "langchain-chroma>=1.1.0",
    "langchain-google-genai>=4.4.0",
]

[project.scripts]
aws-rag = "aws_rag:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
